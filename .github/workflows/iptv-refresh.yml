name: IPTV 源优选刷新

on:
  schedule:
    # 每天 UTC 00:00 = 北京时间 08:00
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      deep:
        description: "启用分片级深度校验（多花几分钟，能剔除索引通但分片死的假活源）"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: iptv-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 采集并实测优选
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.deep }}" = "true" ]; then
            echo "模式: 深度校验"
            python iptv/filter_iptv.py --deep
          else
            echo "模式: 快速"
            python iptv/filter_iptv.py
          fi

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add iptv/output
          if git diff --cached --quiet; then
            echo "本次结果无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore(iptv): 自动刷新优选结果 $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push

name: IPTV 源优选刷新

on:
  schedule:
    # 每天 UTC 00:00 = 北京时间 08:00
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: iptv-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 采集并实测优选
        run: python iptv/filter_iptv.py

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add iptv/output
          if git diff --cached --quiet; then
            echo "本次结果无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore(iptv): 自动刷新优选结果 $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
